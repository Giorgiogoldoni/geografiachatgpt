name: World Top 4 — Daily research update
on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt --break-system-packages -q
      - name: Calculate World Top 4 models
        run: python world_top4.py
      - name: Commit research data
        run: |
          git config user.name "geografia-bot"
          git config user.email "geografia-bot@users.noreply.github.com"
          git add world_top4.json
          git diff --staged --quiet || git commit -m "Daily World Top 4 model update"
          git pull --rebase
          git push
