name: World Top 4 — Daily research update
on:
  push:
    branches: [main]
    paths:
      - 'world_top4.py'
      - 'world_top4_6040.py'
      - 'world_top4_region_sensitivity.py'
      - 'world_top4_robustness.py'
      - 'world_top4_solver_experimental.py'
      - '.github/workflows/world-top4.yml'
      - 'requirements.txt'
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
concurrency:
  group: world-top4-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt --break-system-packages -q
      - name: Calculate exploratory model
        run: python world_top4.py
      - name: Calculate separate 60/40 audit scenario
        run: python world_top4_6040.py
      - name: Compare fourth-region hypotheses (Africa / Middle East)
        run: python world_top4_region_sensitivity.py
      - name: Run robustness tests (Asia two slots / Greece exclusion)
        run: python world_top4_robustness.py
      - name: Run experimental historical Modified Sharpe solver
        run: python world_top4_solver_experimental.py
      - name: Commit research data
        run: |
          git config user.name "geografia-bot"
          git config user.email "geografia-bot@users.noreply.github.com"
          git add world_top4.json world_top4_6040.json world_top4_region_sensitivity.json world_top4_robustness.json world_top4_solver_experimental.json
          git diff --staged --quiet || git commit -m "Daily World Top 4 model update"
          git pull --rebase
          git push
