name: GeografiaChatGPT — six-area ETF engine
on:
  push:
    branches: [main]
    paths:
      - 'geografia_engine.py'
      - 'bollettino_geografico.py'
      - 'data/geografia_index_user_51.csv'
      - 'data/geografia_index_factor_14.csv'
      - 'ucits_country_universe_seed_2026-11-18.csv'
      - 'geografia-moduli.json'
      - 'requirements.txt'
      - '.github/workflows/geografia-engine.yml'
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: geografia-engine-main
  cancel-in-progress: true
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt --break-system-packages -q
      - name: Calculate six-area rankings and monthly research backtests
        run: python geografia_engine.py
      - name: Write append-only daily bulletin page
        run: python bollettino_geografico.py
      - name: Commit daily engine output and bulletin archive
        run: |
          git config user.name "geografia-bot"
          git config user.email "geografia-bot@users.noreply.github.com"
          git add geografia-motore.json etf_lifecycle_registry.csv data/bollettino_geografico.json
          git diff --staged --quiet || git commit -m "Daily geographic bulletin and engine update"
          git pull --rebase
          git push
