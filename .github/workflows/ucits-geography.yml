name: UCITS Geographic Rotation — daily engine
on:
  push:
    branches: [main]
    paths:
      - 'ucits_geography.py'
      - 'ucits_country_universe_seed_2026-11-18.csv'
      - '.github/workflows/ucits-geography.yml'
  schedule:
    - cron: '15 21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucits-geography-main
  cancel-in-progress: true
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt --break-system-packages -q
      - name: Run UCITS geographic engine
        run: python ucits_geography.py
      - name: Commit daily ranking
        run: |
          git config user.name "geografia-bot"
          git config user.email "geografia-bot@users.noreply.github.com"
          git add ucits_geography.json
          git diff --staged --quiet || git commit -m "Daily UCITS geographic ranking"
          git pull --rebase
          git push
