name: Radar Predittivo — technical engine
on:
  push:
    branches: [main]
    paths:
      - 'radar_predittivo_engine.py'
      - 'geografia-motore.json'
      - 'data/geografia_index_factor_14.csv'
      - 'data/historical_country_etfs_2007.csv'
      - '.github/workflows/radar-predittivo.yml'
  schedule:
    - cron: '15 23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-predittivo-main
  cancel-in-progress: true
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt --break-system-packages -q
      - name: Calculate predictive technical radar and walk-forward evaluation
        run: python radar_predittivo_engine.py
      - name: Commit radar output
        run: |
          git config user.name "geografia-bot"
          git config user.email "geografia-bot@users.noreply.github.com"
          git add radar-predittivo.json
          git diff --staged --quiet || git commit -m "Update predictive geographic radar"
          git pull --rebase
          git push
